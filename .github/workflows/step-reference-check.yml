name: Step reference check

on:
  pull_request:
    paths:
      - "agents/**"
      - "docs/manuals/**"
      - "docs/adr/**"
      - "docs/strategy/**"
      - "docs/visuals/**"
      - "docs/references/**"
      - "docs/reports/**"
      - ".claude/**"
      - ".github/*.md"
      - ".github/ISSUE_TEMPLATE/**/*.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "README.md"
      - "QUICKSTART.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".github/scripts/check-step-references.js"
  push:
    branches: [main, develop]
    paths:
      - "agents/**"
      - "docs/manuals/**"
      - "docs/adr/**"
      - "docs/strategy/**"
      - "docs/visuals/**"
      - "docs/references/**"
      - "docs/reports/**"
      - ".claude/**"
      - ".github/*.md"
      - ".github/ISSUE_TEMPLATE/**/*.md"
      - "CLAUDE.md"
      - "AGENTS.md"
      - "README.md"
      - "QUICKSTART.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".github/scripts/check-step-references.js"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check operation-manual step references resolve
        run: node .github/scripts/check-step-references.js
