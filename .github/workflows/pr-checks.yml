# Absorbs the retired docs-governance.yml and adds the licorsy/platform-
# workflows reusable checks. Mirrors git-governance's dogfooded pr-checks.yml:
# local pre-commit is the continuous gate everywhere including develop; the
# pre-commit/Conventional-Commits job here is the remote backstop, run only
# at the two deliberate promotion points (staging, main) or on demand, to
# save Actions minutes. ci-docs/ci-security are NOT branch-restricted: docs
# correctness and secret scanning should be caught as early as develop.
name: PR checks

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop, main]
  workflow_dispatch: {}

jobs:
  pre-commit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.base.ref == 'staging' ||
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run file-content hooks
        run: pre-commit run --all-files
      # The Conventional Commits lint that used to live here was removed
      # deliberately. It ran only on pull requests into staging/main, and on a
      # promotion PR every commit in range is already merged into develop — so
      # it could report unfixable history and nothing else. Correcting a finding
      # meant rewriting a protected branch.
      #
      # The one place it could have prevented something is a work branch into
      # develop, which is exactly where this workflow does not run, by design.
      # The commit-msg hook in .pre-commit-config.yaml already gates every
      # commit as it is written, which is both earlier and cheaper.

  # Promotions only: a pull request into staging must come from develop, and
  # into main from staging.
  #
  # Rulesets require a pull request and block direct pushes, force-pushes and
  # deletion, but place no constraint on where a pull request comes FROM. A
  # single-parent commit landed straight on main in this repository that way, so
  # develop and staging both lacked the file — and because a staging -> main
  # merge preserves main's side, every later promotion re-showed the same
  # difference until someone back-merged.
  #
  # hotfix/ is not an exception: the git-governance taxonomy is explicit that
  # the label signals urgency, not a bypass route.
  promotion-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request comes from the branch below it
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            staging) expected=develop ;;
            main)    expected=staging ;;
            *)       echo "No promotion constraint on '$BASE'."; exit 0 ;;
          esac
          if [ "$HEAD" != "$expected" ]; then
            echo "::error::A pull request into '$BASE' must come from '$expected', not '$HEAD'."
            echo "Branch flow is feat/* -> develop -> staging -> main; staging and main"
            echo "receive promotions only, never a work branch directly."
            exit 1
          fi
          echo "OK: '$HEAD' -> '$BASE' is a promotion."

  # Replaces the retired docs-governance.yml — same licorsy/docs-governance
  # check, delegated through the reusable workflow.
  #
  # ADOPTERS, READ THIS. This repository is a GitHub template, so a project
  # created from it inherits a dependency on workflow definitions the Licorsy
  # organization controls and could change or delete. The owner guard on this
  # job and the next makes that explicit rather than silent: outside `licorsy`
  # both are skipped, and no documentation or security check runs until you
  # decide what should. To turn them on, either repoint the `uses:` lines at
  # your own copies of these workflows, or delete the `if:` if you are content
  # to consume Licorsy's.
  #
  # The guard is a job-level `if:` on purpose. A reusable-workflow call
  # supports only job-level conditions, and `hashFiles()` is not a recognized
  # function there — confirmed by a failed dispatch, not assumed — so the
  # capability-style guard git-governance uses at step level cannot be copied
  # here. `github.repository_owner` is valid in a job-level `if:` and answers
  # the question that actually matters for a template: whose workflows are
  # these.
  ci-docs:
    if: github.repository_owner == 'licorsy'
    uses: licorsy/platform-workflows/.github/workflows/ci-docs.yml@v1
    with:
      base-sha: ${{ github.event.pull_request.base.sha }}

  # dependency-review (self-gated to staging/main inside the reusable workflow)
  # plus secret-scanning on every trigger. Needs an org-level GITLEAKS_LICENSE
  # secret to fully function — see licorsy/platform-workflows's README.
  #
  # Same owner guard, same reason as ci-docs above.
  ci-security:
    if: github.repository_owner == 'licorsy'
    uses: licorsy/platform-workflows/.github/workflows/ci-security.yml@v1
    secrets: inherit
