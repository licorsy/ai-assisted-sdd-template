# Template for adopter projects: PR-title Conventional Commits check.
# Copy to .github/workflows/conventional-commits.yml in your project.
# With squash merges + "default to PR title", checking the PR title
# effectively standardizes the commit history on main.
name: Conventional commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      # amannn/action-semantic-pull-request v6.1.1, pinned by commit SHA
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
